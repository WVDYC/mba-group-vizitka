<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор каталога — MBA Group</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px;margin:auto;padding:50px 20px}h1{font-size:42px;letter-spacing:-2px}p{color:var(--muted);line-height:1.8}textarea,input{width:100%;padding:12px;background:#30352a;color:white;border:1px solid #59634a;margin-bottom:16px}textarea{min-height:100px}fieldset{border:1px solid var(--line);margin:20px 0;padding:20px}button{margin:5px}#status{color:var(--yellow)}.toolbar{display:flex;flex-wrap:wrap;gap:10px}#items select{margin-bottom:16px}</style></head><body><main><a href="index.html">← На сайт</a><h1>Редактор каталога</h1><p>Добавляйте технику, изменяйте цены и фотографии. Изменения сохраняются в JSON-файл на ваш компьютер. Для обновления сайта замените <code>dist/catalog.json</code> в репозитории и опубликуйте новую версию. Этот редактор не меняет сайт автоматически.</p><div class="toolbar"><button class="button yellow" id="add">+ Добавить технику</button><button class="button" id="download">Скачать catalog.json ↓</button></div><p id="status" role="status"></p><div id="items"></div></main><script>
let items=[];const fields=[['name','Название'],['label','Подпись на фото'],['description','Описание'],['price','Цена в тенге (пусто — по запросу)'],['image','Путь к фото или HTTPS-ссылка']];
function field(label,el){const wrap=document.createElement('label');wrap.textContent=label;wrap.append(el);return wrap;}
function render(){const root=document.querySelector('#items');root.replaceChildren();items.forEach((item,index)=>{const box=document.createElement('fieldset');const title=document.createElement('legend');title.textContent='Техника '+(index+1);box.append(title);for(const [key,label]of fields){const input=document.createElement(key==='description'?'textarea':'input');input.value=item[key]??'';if(key==='price'){input.type='number';input.min='0';input.step='1';}input.addEventListener('input',()=>item[key]=key==='price'?(input.value===''?null:Number(input.value)):input.value);box.append(field(label,input));}for(const [key,label,choices]of [['category','Категория',[['crane','Краны'],['loader','Погрузчики'],['excavator','Экскаваторы'],['lift','Автовышки'],['compressor','Компрессоры']]],['period','Период',[['month','Месяц'],['day','День']]]]){const select=document.createElement('select');for(const [value,text]of choices){const opt=document.createElement('option');opt.value=value;opt.textContent=text;select.append(opt);}select.value=item[key];select.addEventListener('change',()=>item[key]=select.value);box.append(field(label,select));}const remove=document.createElement('button');remove.textContent='Удалить позицию';remove.type='button';remove.addEventListener('click',()=>{items.splice(index,1);render();});box.append(remove);root.append(box);});}
document.querySelector('#add').onclick=()=>{items.unshift({id:'equipment-'+Date.now(),name:'Новая техника',label:'Спецтехника',description:'',price:null,period:'month',category:'crane',image:'assets/site-work.jpg'});render();};
document.querySelector('#download').onclick=()=>{const bad=items.some(i=>!i.name.trim()||!i.description.trim()||!i.label.trim()||!(/^(assets\/[\w./-]+|https:\/\/\S+)$/).test(i.image)||i.price!==null&&(!Number.isFinite(i.price)||i.price<0));if(bad||items.length===0){document.querySelector('#status').textContent='Заполните название, подпись, описание и фото каждой позиции. Цена должна быть положительной или пустой.';return;}const url=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='catalog.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Файл скачан. Замените dist/catalog.json в репозитории и опубликуйте обновление.';};fetch('catalog.json').then(r=>r.json()).then(data=>{items=data;render();}).catch(()=>document.querySelector('#status').textContent='Не удалось загрузить каталог. Можно создать новый.');
</script></body></html>
